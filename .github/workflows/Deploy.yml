
name: Deploy Node.js Application To EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 2m
          script: |
            set -e
            echo "STEP 1: SSH connected"
            whoami
            echo "STEP 2: Checking directory"
            cd /root/Express_Test_Server_Github_Actions
            pwd
            echo "STEP 3: Pulling latest code"
            timeout 60s git pull origin main
            echo "STEP 4: Installing dependencies"
            npm install --no-audit --no-fund
            echo "STEP 5: Restarting application"
            pm2 restart myapp || pm2 start index.js --name myapp
            pm2 save
            echo "DEPLOYMENT COMPLETED"
